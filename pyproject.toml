[project]
name = "mediatools"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "appdirs",
    "dotenv>=0.9.9",
    "ffmpeg-python",
    "imagehash",
    "iso639",
    "langdetect",
    "openai>=1.84.0",
    "pillow",
    "pillow-heif",
    "pysrt",
    "python-magic",
    "rich-click>=1.8.9",
]
readme = "README.md"
description = "File (and media) manipulation tools"
license = "GPL-3.0-or-later"
# dynamic = [
#   "version",
# ]

[project.scripts]
mediatool = "mediatools.cli:mediatool"
u-renamer = "u.tools.renamers:rename_cmd"
multitool = "mediatools.cli:multitool"
glados = "mediatools.cli:glados"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.3.0",
    "pre-commit>=4.2.0",
    "ruff>=0.12.9",
]
extra = [
    "rembg>=2.0.67",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[bdist_wheel]
universal = 1

[tool.setuptools]
packages = ["mediatools", "mediatools.lib", "mediatools.backends"]

[tool.setuptools.dynamic]
version = { attr = "mediatools.__version__" }

[tool.black]
target-version = ['py313']

[tool.isort]
profile = "black"
